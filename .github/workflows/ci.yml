name: 🔍 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Test and Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22]
        
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
          
      - name: 📋 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          
      - name: 🔍 Verify pnpm installation
        run: |
          echo "📦 pnpm version: $(pnpm --version)"
          echo "📋 Node.js version: $(node --version)"
          echo "📦 npm version: $(npm --version)"
          
      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: 🔐 Audit dependencies
        run: pnpm audit --audit-level=high
        
      - name: 🎨 Lint
        run: pnpm run lint
        
      - name: 🔎 Typecheck
        run: pnpm run typecheck
        
      - name: 🏗️ Build library
        run: pnpm run build
        
      - name: ✅ Validate package
        run: npm pack --dry-run
        
      - name: 📋 Check exports
        run: |
          echo "🔍 Checking build structure:"
          echo "📂 Dist files:"
          ls -la dist/
          echo "🔍 Checking main entry points exist:"
          test -f dist/index.cjs && echo "✅ CJS bundle exists"
          test -f dist/index.mjs && echo "✅ ESM bundle exists"
          test -f dist/index.d.cts && echo "✅ CJS TypeScript declarations exist"
          test -f dist/index.d.mts && echo "✅ ESM TypeScript declarations exist"
          test -f dist/index.cjs.map && echo "✅ CJS source map exists"
          test -f dist/index.mjs.map && echo "✅ ESM source map exists"
          
      - name: 🔍 Verify TypeScript declarations
        run: |
          echo "🔍 Checking TypeScript declarations:"
          ls -la dist/*.d.cts dist/*.d.mts
          echo "📋 Sample CJS declaration:"
          head -10 dist/index.d.cts
          
      - name: 📊 Build summary
        run: |
          echo "🎉 Build completed successfully!"
          echo "📦 Bundle sizes:"
          du -h dist/index.cjs dist/index.mjs
          echo "📦 Total build size: $(du -sh dist | cut -f1)" 